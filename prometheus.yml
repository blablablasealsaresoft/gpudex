# Prometheus Configuration for GPUDex
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "rules/*.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # GPUDex Backend API
  - job_name: 'gpudx-api'
    static_configs:
      - targets: ['api_service:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # GPUDex Real API
  - job_name: 'gpudx-real-api'
    static_configs:
      - targets: ['real_api_service:8001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Enterprise Dashboard
  - job_name: 'gpudx-enterprise'
    static_configs:
      - targets: ['enterprise_revenue_dashboard:8002']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Redis (commented out - no metrics endpoint, causes security alerts)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis:6379']

  # PostgreSQL (commented out - no metrics endpoint available)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres:5432']

  # Nginx
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    scrape_interval: 30s

  # Frontend
  - job_name: 'frontend'
    static_configs:
      - targets: ['frontend:80']
    scrape_interval: 30s

  # Enterprise API Integration
  - job_name: 'gpudx-enterprise-api'
    static_configs:
      - targets: ['enterprise_api_integration:8003']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Token Service
  - job_name: 'gpudx-token-service'
    static_configs:
      - targets: ['token_service:8004']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Social Gamification Service
  - job_name: 'gpudx-social-gamification'
    static_configs:
      - targets: ['social_gamification_service:8005']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # P2P GPU Service
  - job_name: 'gpudx-p2p-gpu'
    static_configs:
      - targets: ['p2p_gpu_service:8006']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Community Onboarding Service
  - job_name: 'gpudx-community-onboarding'
    static_configs:
      - targets: ['community_onboarding_service:8007']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # AI Optimization Service
  - job_name: 'gpudx-ai-optimization'
    static_configs:
      - targets: ['ai_optimization_service:8008']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Platform Integration Service
  - job_name: 'gpudx-platform-integration'
    static_configs:
      - targets: ['gpudx_platform_integration:8009']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Utility Validation Service
  - job_name: 'gpudx-utility-validation'
    static_configs:
      - targets: ['utility_validation_service:8010']
    metrics_path: '/metrics'
    scrape_interval: 30s