# GPUDex Frontend - Production Nginx Configuration

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    
    server {
    listen 80;
    server_name _;
    
    # Root directory
    root /usr/share/nginx/html;
    index beta-gate.html index.html;
    
    # Favicon handling - prevent 404/502 errors
    location = /favicon.ico {
        try_files /favicon.svg /favicon.ico =204;
        access_log off;
        log_not_found off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location = /favicon.svg {
        try_files /favicon.svg =204;
        access_log off; 
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "image/svg+xml";
    }
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' http://backend:8000 http://localhost:8000 https:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    
    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Beta Gate - Main landing page
    location = / {
        try_files /beta-gate.html =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
    
    # Main location for all other routes
    location / {
        try_files $uri $uri/ /beta-gate.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }
        
        # No cache for HTML files (beta gate and main app)
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Metrics endpoint for Prometheus
    location /metrics {
        access_log off;
        return 200 "# HELP nginx_frontend_up Whether nginx frontend is up\n# TYPE nginx_frontend_up gauge\nnginx_frontend_up 1\n# HELP nginx_frontend_connections_total Total number of frontend connections\n# TYPE nginx_frontend_connections_total counter\nnginx_frontend_connections_total 0\n";
        add_header Content-Type text/plain;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Custom error pages - redirect to beta gate
    error_page 404 /beta-gate.html;
    error_page 500 502 503 504 /beta-gate.html;
}
} 