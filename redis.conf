# GPUDex Redis Configuration for Production

# Basic Configuration
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 300

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Append Only File
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Security
protected-mode no
# requirepass your_redis_password_here

# Performance
tcp-backlog 511
databases 16
hz 10

# Logging
loglevel notice
logfile ""

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client Management
maxclients 10000

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
# rename-command CONFIG "" 