name: gpudex
services:
- name: api
  source_dir: /backend
  github:
    repo: blablablasealsaresoft/gpudex
    branch: main
  run_command: python render_start.py
  environment_slug: python
  instance_count: 1
  instance_size_slug: basic-xxs
  envs:
  - key: DATABASE_URL
    value: ${db.DATABASE_URL}
  - key: ENVIRONMENT
    value: production
  - key: PORT
    value: "8080"
  http_port: 8080

- name: web
  source_dir: /frontend
  github:
    repo: blablablasealsaresoft/gpudex
    branch: main
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  build_command: echo "No build needed for static files"
  run_command: |
    cp -r . /var/www/html/ && 
    sed -i 's|https://gpudex.onrender.com|${api.PUBLIC_URL}|g' /var/www/html/index.html &&
    nginx -g 'daemon off;'
  http_port: 80

databases:
- name: db
  engine: PG
  size: db-s-dev-database
  num_nodes: 1
  version: "15" 